# Uruchomienie całego projektu jedną komendą:  docker compose up --build
# Strona i panel:  http://localhost:8080      Podgląd bazy (Adminer):  http://localhost:8081
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mv
      POSTGRES_USER: mv
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mv_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # tylko z tego komputera; zajęty port? zmień lewą liczbę
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mv -d mv"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mv
      SPRING_DATASOURCE_USERNAME: mv
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mv_dev_password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      DEMO_DATA: ${DEMO_DATA:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - invoices:/data/invoices
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  invoices:
